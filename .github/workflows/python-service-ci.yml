name: Python Service CI

on:
  pull_request:
    branches:
      - dev
      - master
    paths:
      - "services/farol_intelligence/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/python-service-ci.yml"
  push:
    branches:
      - dev
      - master
    paths:
      - "services/farol_intelligence/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/python-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence:
    name: intelligence-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/farol_intelligence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect Python test suite
        id: python_checks
        run: |
          if [ -d tests ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install intelligence service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run intelligence tests
        if: steps.python_checks.outputs.has_tests == 'true'
        run: python -m unittest discover tests
