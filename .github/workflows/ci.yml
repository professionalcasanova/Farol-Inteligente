name: CI

on:
  pull_request:
    branches:
      - master
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend-build-and-test
    runs-on: windows-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore Farol.sln

      - name: Build backend
        run: dotnet build Farol.sln --no-restore -c Release -m:1 -v minimal

      - name: Test backend
        run: dotnet test tests/Farol.Tests/Farol.Tests.csproj --no-build -c Release -m:1 -v minimal

  frontend:
    name: frontend-build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      CI: true
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5258

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  intelligence:
    name: intelligence-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/farol_intelligence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install intelligence service
        run: python -m pip install -e .

      - name: Run intelligence tests
        run: python -m unittest tests/test_analysis.py
