name: Backend CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend-build-and-test
    runs-on: windows-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate NuGet config
        shell: pwsh
        run: ./scripts/validate-nuget-config.ps1

      - name: Restore backend
        run: dotnet restore Farol.sln

      - name: Build backend
        run: dotnet build Farol.sln --no-restore -c Release -m:1 -v minimal

      - name: Test backend
        run: dotnet test tests/Farol.Tests/Farol.Tests.csproj --no-build -c Release -m:1 -v minimal
