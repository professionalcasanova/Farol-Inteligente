databases:
  - name: farol-postgres
    databaseName: farol
    user: farol

services:
  - type: pserv
    name: farol-intelligence
    runtime: docker
    dockerContext: .
    dockerfilePath: ./services/farol_intelligence/Dockerfile
    autoDeployTrigger: off
    envVars:
      - key: FAROL_ENVIRONMENT
        value: Production
      - key: FAROL_INTERNAL_API_KEY
        sync: false

  - type: web
    name: farol-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./src/Farol.Api/Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Jwt__Issuer
        value: Farol.Api
      - key: Jwt__Audience
        value: Farol.Client
      - key: Jwt__SigningKey
        generateValue: true
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: farol-postgres
          property: connectionString
      - key: FinancialIntelligence__BaseUrl
        sync: false
      - key: FAROL_INTERNAL_API_KEY
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
