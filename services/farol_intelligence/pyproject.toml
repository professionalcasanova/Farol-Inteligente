[project]
name = "farol-intelligence"
version = "0.1.0"
description = "Deterministic financial intelligence service for Farol."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "idna>=3.15,<4.0",
  "starlette>=1.3.1,<2.0",
]

[project.optional-dependencies]
receipt-reading = [
  "pdfplumber>=0.11,<1.0",
  "paddleocr>=3.0,<4.0",
  "paddlepaddle>=3.0,<4.0",
  "opencv-python-headless>=4.10,<5.0",
  "pytesseract>=0.3,<1.0",
  "Pillow>=10,<13",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"
