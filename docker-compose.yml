services:
  postgres:
    image: postgres:16.8
    container_name: farol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: farol_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farol_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - farol-postgres-data:/var/lib/postgresql/data

volumes:
  farol-postgres-data:
